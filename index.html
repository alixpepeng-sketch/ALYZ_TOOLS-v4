<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ALYZ TOOLS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="dots"></div>

<section id="loginView" class="view">
  <div class="shapes"><i></i><i></i><i></i><i></i></div>
  <div class="login-card card">
    <div class="mark xl"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
    <h1 class="logo">ALYZ TOOLS</h1>
    <p class="sub">MASUK UNTUK MELANJUTKAN</p>
    <input id="username" class="input" type="text" placeholder="@alyzganteng" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="loginError"></div>
    <button id="btnLogin" class="btn">LOGIN</button>
    <div class="split"><button id="btnGuest" class="btn btn-light">GUEST</button><button id="btnGoogle" class="btn btn-light">GOOGLE</button></div>
  </div>
</section>

<section id="appView" class="view" style="display:none">
  <header class="topbar">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span><span class="logo-sm">ALYZ TOOLS</span></div>
    <span id="userChip" class="chip"></span>
  </header>

  <main class="content">
    <div id="tabTools" class="tab show">
      <h2 class="title">TOOLS</h2>
      <div class="grid" id="toolGrid"></div>
    </div>

    <div id="tabChat" class="tab" style="display:none">
      <h2 class="title">CHAT GLOBAL</h2>
      <div id="chatBox" class="chatbox"></div>
      <div class="row">
        <input id="chatInput" class="input" type="text" placeholder="Tulis pesan..." autocomplete="off">
        <button id="chatSend" class="btn btn-inline" aria-label="Kirim"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
    </div>

    <div id="tabProfil" class="tab" style="display:none">
      <h2 class="title">PROFIL</h2>
      <div class="card profile">
        <div id="avatar" class="avatar"></div>
        <p class="label">USERNAME</p>
        <p id="profName" class="big"></p>
      </div>
      <button id="btnLogout" class="btn" style="margin-top:22px">LOGOUT</button>
    </div>
  </main>

  <div id="toolBody" class="toolbody" style="display:none"></div>

  <nav class="bottom-nav" id="nav" style="--i:0">
    <span class="nav-ind"></span>
    <button class="nav-btn active" data-tab="tools"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>TOOLS</span></button>
    <button class="nav-btn" data-tab="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.7 7.1L3 21l1.9-6.3A8 8 0 1121 12z"/></svg><span>CHAT</span></button>
    <button class="nav-btn" data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>PROFIL</span></button>
  </nav>
</section>

<script type="module" src="./app.js"></script>
</body>
</html>
